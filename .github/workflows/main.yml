name: Release Addon

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Package addon
        run: |
          mkdir -p dist/DecorVendor
          rsync -av ./ dist/DecorVendor/ \
            --exclude=".git" \
            --exclude=".github" \
            --exclude="dist"
          cd dist
          zip -r DecorVendor.zip DecorVendor

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/DecorVendor.zip
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload to Wago
        uses: BigWigsMods/packager@v2
        env:
          WAGO_API_TOKEN: ${{ secrets.WAGO_API_TOKEN }}
